name: Chronos Raspberry Pi Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi-test:
    name: Raspberry Pi 5 Tests
    runs-on: [self-hosted, Linux, ARM64, chronos-pi]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Display environment
        run: |
          uname -m
          python3 --version

      - name: Run Chronos tests
        run: |
          python3 -m unittest discover \
            -s software/tests \
            -p "test_*.py" \
            -v
